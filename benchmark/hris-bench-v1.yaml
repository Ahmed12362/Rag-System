# HRIS RAG benchmark, version 1 (Task 3.4). 100 hand-written cases.
#
# Labels live ONLY here (never in corpus/ or corpus-spec/ prose, never passed to the answering pipeline).
# Relevant documents are NOT hand-picked: BenchmarkDataset derives them from `facts` via corpus-spec
# (ACTIVE, not distractor/injection, visible to the asker, in scope, optional target language). Grade 2 = CORE or
# DEPARTMENT document, grade 1 = supporting FAQ / procedure / handbook page. `docs` overrides the derivation explicitly.
#
# must_contain:     each item must appear in the answer; "a|b" = any alternative (numbers are matched after digit normalization)
# must_not_contain: none of these may appear (superseded/draft values, injected claims, restricted data)
# expected_behavior: ANSWER | ABSTAIN | REFUSE
# expected_auth:     ALLOWED | DENIED (tool / data authorization outcome)
# Reference date for all structured answers: 2026-11-01 (Africa/Cairo), see docs/synthetic-dataset.md §5.

name: hris-bench
version: "1.0"
reference_date: 2026-11-01

targets: {FACTUAL: 25, MULTI_HOP: 15, CROSS_LINGUAL: 20, UNANSWERABLE: 10, SECURITY: 12, STRUCTURED: 18}

askers:
  E-1000: {role: MANAGER, department: D-ENG}
  E-1001: {role: EMPLOYEE, department: D-ENG}
  E-1002: {role: EMPLOYEE, department: D-ENG}
  E-1003: {role: HR_ADMIN, department: D-HR}
  E-1004: {role: EMPLOYEE, department: D-FIN}

tools: [search_policies, get_leave_balance, get_leave_request_status, get_upcoming_meetings, get_attendance_summary]

cases:
  # ================================================================= FACTUAL (13 EN, 12 AR)
  - {id: FACT-EN-01, category: FACTUAL, language: en, asker: E-1001, facts: [ANNUAL_LEAVE_DAYS],
     question: "How many days of paid annual leave do I get each year?", must_contain: ["21"],
     reference: "21 working days of paid annual leave per calendar year."}
  - {id: FACT-EN-02, category: FACTUAL, language: en, asker: E-1001, facts: [ANNUAL_LEAVE_NOTICE_DAYS],
     question: "How early do I need to put in a request before going on vacation?", must_contain: ["14"],
     must_not_contain: ["7 days", "7 calendar days"], note: "trap: superseded v1.0 says 7 days",
     reference: "At least 14 calendar days before the first day of leave; shorter notice is at the manager's discretion."}
  - {id: FACT-EN-03, category: FACTUAL, language: en, asker: E-1001, facts: [REMOTE_DAYS_PER_WEEK],
     question: "What's the maximum number of work-from-home days I can have in a week?", must_contain: ["2"],
     must_not_contain: ["3 days per week", "1 day per week"], note: "traps: draft v3.0 says 3, superseded v1.0 says 1",
     reference: "Up to 2 days per week with the direct manager's approval (eligible departments)."}
  - {id: FACT-EN-04, category: FACTUAL, language: en, asker: E-1001, facts: [LATE_GRACE_MINUTES],
     question: "If I walk in a few minutes after nine, when does it start counting as late?", must_contain: ["15"],
     must_not_contain: ["10 minutes"], note: "trap: superseded attendance policy says 10 minutes",
     reference: "Arrivals up to 15 minutes after 09:00 are within the grace period."}
  - {id: FACT-EN-05, category: FACTUAL, language: en, asker: E-1001, facts: [SICK_CERTIFICATE_THRESHOLD_DAYS],
     question: "Do I need a doctor's note if I'm off sick for just one day?", must_contain: ["1"],
     note: "trap: superseded sick leave policy says longer than 2 days",
     reference: "No; a medical certificate is required only for sick leave longer than 1 working day."}
  - {id: FACT-EN-06, category: FACTUAL, language: en, asker: E-1001, facts: [WORK_END_TIME],
     question: "What time can I leave the office on a normal day?", must_contain: ["17:00|5 pm|5:00 pm"],
     reference: "The working day ends at 17:00."}
  - {id: FACT-EN-07, category: FACTUAL, language: en, asker: E-1001, facts: [OVERTIME_MAX_HOURS_WEEK],
     question: "Is there a weekly cap on approved overtime?", must_contain: ["10"],
     reference: "Approved overtime may not exceed 10 hours per week."}
  - {id: FACT-EN-08, category: FACTUAL, language: en, asker: E-1001, facts: [PROBATION_MONTHS],
     question: "How long does a new hire stay on probation?", must_contain: ["3"],
     reference: "3 months."}
  - {id: FACT-EN-09, category: FACTUAL, language: en, asker: E-1001, facts: [PAYDAY],
     question: "On which day of the month does my salary arrive?", must_contain: ["25"],
     reference: "On the 25th; if it falls on a weekend or holiday, the previous working day."}
  - {id: FACT-EN-10, category: FACTUAL, language: en, asker: E-1001, facts: [APPEAL_DAYS],
     question: "How much time do I have to challenge a disciplinary decision?", must_contain: ["7"],
     reference: "An appeal must be made in writing within 7 calendar days."}
  - {id: FACT-EN-11, category: FACTUAL, language: en, asker: E-1001, facts: [SPOT_AWARD_MAX_PER_YEAR],
     question: "Is there a limit on how many spot awards one person can get annually?", must_contain: ["3"],
     reference: "At most 3 spot awards per calendar year."}
  - {id: FACT-EN-12, category: FACTUAL, language: en, asker: E-1001, facts: [MEETING_AGENDA_HOURS],
     question: "How far ahead should the organizer send out the agenda?", must_contain: ["24"],
     must_not_contain: ["48 hours"], note: "trap: superseded meetings policy says 48 hours",
     reference: "At least 24 hours before the meeting."}
  - {id: FACT-EN-13, category: FACTUAL, language: en, asker: E-1001, facts: [RAMADAN_HOURS],
     question: "What are office hours during the holy month?", must_contain: ["10:00|10 am", "16:00|4 pm"],
     note: "trap: superseded Arabic working hours policy says until 15:00",
     reference: "From 10:00 to 16:00 (6 hours)."}

  - {id: FACT-AR-01, category: FACTUAL, language: ar, asker: E-1001, facts: [SICK_LEAVE_DAYS],
     question: "ما عدد أيام الإجازة المرضية المدفوعة المتاحة للموظف سنوياً؟", must_contain: ["15"],
     reference: "15 يوم عمل في السنة."}
  - {id: FACT-AR-02, category: FACTUAL, language: ar, asker: E-1001, facts: [ANNUAL_LEAVE_LONG_SERVICE_DAYS],
     question: "كم تبلغ الإجازة السنوية لمن تجاوزت خدمته عشر سنوات؟", must_contain: ["30"],
     reference: "30 يوم عمل سنوياً."}
  - {id: FACT-AR-03, category: FACTUAL, language: ar, asker: E-1001, facts: [CASUAL_LEAVE_DAYS],
     question: "كم يوماً من الإجازة العارضة يحق لي في العام؟", must_contain: ["6"],
     reference: "6 أيام في السنة."}
  - {id: FACT-AR-04, category: FACTUAL, language: ar, asker: E-1001, facts: [SICK_NOTIFY_TIME],
     question: "قبل أي ساعة يجب أن أخبر مديري إذا مرضت؟", must_contain: ["10:00|العاشرة"],
     reference: "قبل الساعة 10:00 في أول يوم غياب."}
  - {id: FACT-AR-05, category: FACTUAL, language: ar, asker: E-1001, facts: [UNPAID_LEAVE_MAX_DAYS],
     question: "ما أطول مدة مسموح بها للإجازة غير المدفوعة؟", must_contain: ["30"],
     reference: "حتى 30 يوم عمل في السنة بموافقة المدير والموارد البشرية."}
  - {id: FACT-AR-06, category: FACTUAL, language: ar, asker: E-1001, facts: [BREAK_MINUTES],
     question: "كم دقيقة استراحة يومية يحصل عليها الموظف؟", must_contain: ["30"],
     reference: "30 دقيقة مدفوعة يومياً."}
  - {id: FACT-AR-07, category: FACTUAL, language: ar, asker: E-1001, facts: [REMOTE_CORE_HOURS],
     question: "في أيام العمل من المنزل، ما الساعات التي يجب أن أكون متاحاً خلالها؟", must_contain: ["10:00", "15:00"],
     reference: "من 10:00 إلى 15:00."}
  - {id: FACT-AR-08, category: FACTUAL, language: ar, asker: E-1001, facts: [ANNUAL_LEAVE_CARRY_OVER_DAYS],
     question: "هل أستطيع نقل جزء من رصيد إجازتي غير المستخدم إلى السنة القادمة؟ وكم يوماً؟", must_contain: ["5"],
     reference: "نعم، حتى 5 أيام تستخدم قبل 31 مارس."}
  - {id: FACT-AR-09, category: FACTUAL, language: ar, asker: E-1001, facts: [LEAVE_DECISION_DAYS],
     question: "ما المهلة التي يجب أن يرد فيها المدير على طلب الإجازة؟", must_contain: ["3"],
     reference: "خلال 3 أيام عمل من تقديم الطلب."}
  - {id: FACT-AR-10, category: FACTUAL, language: ar, asker: E-1001, facts: [WARNING_VALIDITY_MONTHS],
     question: "إلى متى يبقى الإنذار التأديبي سارياً؟", must_contain: ["12"],
     reference: "12 شهراً."}
  - {id: FACT-AR-11, category: FACTUAL, language: ar, asker: E-1001, facts: [TRAINING_HOURS_PER_YEAR],
     question: "ما الحد الأدنى من ساعات التدريب المتوقعة من كل موظف خلال العام؟", must_contain: ["40"],
     reference: "40 ساعة على الأقل."}
  - {id: FACT-AR-12, category: FACTUAL, language: ar, asker: E-1001, facts: [RESIGNATION_NOTICE_DAYS],
     question: "كم يوماً يجب أن أعطي الشركة إشعاراً مسبقاً قبل ترك العمل؟", must_contain: ["30"],
     reference: "30 يوماً تقويمياً بإشعار كتابي."}

  # ================================================================= MULTI-HOP (15)
  - {id: MHOP-EN-01, category: MULTI_HOP, language: en, asker: E-1001,
     facts: [ANNUAL_LEAVE_LONG_SERVICE_DAYS, ANNUAL_LEAVE_CARRY_OVER_DAYS],
     question: "I've been with the company for 12 years. How much annual leave do I get, and how much of it can roll over?",
     must_contain: ["30", "5"], reference: "30 working days per year; up to 5 unused days can be carried over until 31 March."}
  - {id: MHOP-EN-02, category: MULTI_HOP, language: en, asker: E-1001, facts: [LATE_GRACE_MINUTES, LATE_DEDUCTION_THRESHOLD],
     question: "If I arrive at 09:20, is that late? And what happens if it happens four times in one month?",
     must_contain: ["15", "3"],
     reference: "Yes, beyond the 15-minute grace period. More than 3 late arrivals in a month lead to a quarter-day deduction for each additional one."}
  - {id: MHOP-EN-03, category: MULTI_HOP, language: en, asker: E-1001,
     facts: [SICK_CERTIFICATE_THRESHOLD_DAYS, SICK_CERTIFICATE_DEADLINE_DAYS],
     question: "I was off sick for three days. What paperwork do I need and what is the deadline after I come back?",
     must_contain: ["3"],
     reference: "A medical certificate (required for more than 1 day), uploaded within 3 working days of returning."}
  - {id: MHOP-EN-04, category: MULTI_HOP, language: en, asker: E-1001, about_department: D-CS, facts: [CS_NO_REMOTE, REMOTE_DAYS_PER_WEEK],
     question: "Customer Support agents: can they work from home two days a week like everyone else?",
     must_contain: ["2"], reference: "No. Customer Support is on-site only; the 2 remote days per week apply to other eligible departments."}
  - {id: MHOP-EN-05, category: MULTI_HOP, language: en, asker: E-1001, facts: [REMOTE_REQUEST_NOTICE_DAYS, REMOTE_CORE_HOURS],
     question: "How much notice do I need for a remote day, and which hours do I have to be reachable?",
     must_contain: ["2", "10:00", "15:00"], reference: "At least 2 working days in advance; online from 10:00 to 15:00."}
  - {id: MHOP-EN-06, category: MULTI_HOP, language: en, asker: E-1004, facts: [FIN_MONTH_END, LEAVE_APPROVER],
     question: "I'm in Finance and want a day off on the last working day of the month. Whose approval do I need?",
     must_contain: ["3"],
     reference: "The direct manager and, because it falls within the last 3 working days of the month, also the Head of Finance."}
  - {id: MHOP-EN-07, category: MULTI_HOP, language: en, asker: E-1000, facts: [MEETING_APPROVAL_RULE, MEETING_AGENDA_HOURS],
     question: "I'm organizing a meeting with 12 people. Do I need anyone's sign-off, and when must the agenda go out?",
     must_contain: ["10", "24"],
     reference: "Yes, the department head must approve meetings with more than 10 attendees; the agenda is due 24 hours before."}
  - {id: MHOP-EN-08, category: MULTI_HOP, language: en, asker: E-1001, facts: [PROBATION_MONTHS, BONUS_ELIGIBILITY_MONTHS],
     question: "I joined four months ago. Am I through probation, and can I get this year's performance bonus?",
     must_contain: ["3", "6"], reference: "Probation is 3 months, so yes; the bonus requires 6 months of service, so not yet."}
  - {id: MHOP-EN-09, category: MULTI_HOP, language: en, asker: E-1001, facts: [LEAVE_COUNTED_IN_WORKING_DAYS, PAYDAY],
     question: "Does a public holiday inside my vacation count against my balance, and when am I paid if the 25th is a Friday?",
     must_contain: ["25"],
     reference: "Public holidays are not deducted. When the 25th falls on a weekend, salary is paid on the previous working day."}
  - {id: MHOP-EN-10, category: MULTI_HOP, language: en, asker: E-1001, facts: [ENG_ON_CALL_RESPONSE_MINUTES, ENG_RELEASE_FREEZE],
     question: "When I'm on call, how quickly must I acknowledge a critical alert, and can we ship a release on Thursday?",
     must_contain: ["30"], reference: "Within 30 minutes; production releases are not deployed on Thursdays."}
  - {id: MHOP-AR-01, category: MULTI_HOP, language: ar, asker: E-1001, facts: [PROBATION_MONTHS, ONBOARDING_DOCUMENTS_DAYS],
     question: "أنا موظف جديد: كم تستمر فترة الاختبار، وخلال كم يوم يجب أن أسلم أوراقي؟", must_contain: ["3", "10"],
     reference: "فترة الاختبار 3 أشهر، وتسلم المستندات خلال 10 أيام عمل."}
  - {id: MHOP-AR-02, category: MULTI_HOP, language: ar, asker: E-1001, facts: [ANNUAL_LEAVE_MAX_CONSECUTIVE_DAYS, LEAVE_APPROVER],
     question: "أريد إجازة سنوية لمدة 20 يوم عمل متصلة، هل تكفي موافقة مديري المباشر؟", must_contain: ["15"],
     reference: "لا، الحد الأقصى 15 يوم عمل متتالية إلا بموافقة رئيس الموارد البشرية."}
  - {id: MHOP-AR-03, category: MULTI_HOP, language: ar, asker: E-1001, facts: [DISCIPLINARY_STEPS, INVESTIGATION_DAYS],
     question: "ما تسلسل العقوبات التأديبية، وكم يستغرق التحقيق في الشكوى؟", must_contain: ["5"],
     reference: "إنذار شفهي ثم كتابي ثم نهائي ثم خصم ثم إيقاف، والتحقيق خلال 5 أيام عمل."}
  - {id: MHOP-AR-04, category: MULTI_HOP, language: ar, asker: E-1001, facts: [DAILY_WORKING_HOURS, RAMADAN_HOURS],
     question: "كم ساعة يعمل الموظف في اليوم العادي، ومتى ينتهي الدوام في رمضان؟", must_contain: ["8", "16:00"],
     reference: "8 ساعات يومياً، وفي رمضان من 10:00 إلى 16:00."}
  - {id: MHOP-EG-01, category: MULTI_HOP, language: ar-eg, asker: E-1001, facts: [RESIGNATION_NOTICE_DAYS, EXIT_CLEARANCE_DAYS],
     question: "عايز أسيب الشغل، لازم أبلغهم قبلها بقد إيه، والمستحقات بتتصرف بعد قد إيه؟", must_contain: ["30", "3"],
     reference: "إشعار 30 يوم، والتسوية النهائية خلال 3 أسابيع من إخلاء الطرف."}

  # ================================================================= CROSS-LINGUAL (20)
  # target_language restricts the relevant set to the OTHER language (ar-msa = Arabic, excluding Egyptian-dialect pages).
  - {id: XLING-EN2AR-01, category: CROSS_LINGUAL, xling: EN_TO_AR, language: en, target_language: ar, asker: E-1001,
     facts: [CASUAL_LEAVE_DAYS], question: "How many casual days off can I take per year?", must_contain: ["6"]}
  - {id: XLING-EN2AR-02, category: CROSS_LINGUAL, xling: EN_TO_AR, language: en, target_language: ar, asker: E-1001,
     facts: [SICK_NOTIFY_TIME], question: "By what time must I let my boss know I'm sick?", must_contain: ["10:00|10 am"]}
  - {id: XLING-EN2AR-03, category: CROSS_LINGUAL, xling: EN_TO_AR, language: en, target_language: ar, asker: E-1001,
     facts: [UNPAID_LEAVE_NOTICE_DAYS], question: "How far ahead should unpaid leave be requested?", must_contain: ["30"]}
  - {id: XLING-EN2AR-04, category: CROSS_LINGUAL, xling: EN_TO_AR, language: en, target_language: ar, asker: E-1001,
     facts: [TRAINING_HOURS_PER_YEAR], question: "What is the yearly training-hours expectation?", must_contain: ["40"]}
  - {id: XLING-EN2AR-05, category: CROSS_LINGUAL, xling: EN_TO_AR, language: en, target_language: ar, asker: E-1001,
     facts: [MISSED_CHECKIN_CORRECTION_DAYS], question: "I forgot to badge in yesterday. How long do I have to fix it?",
     must_contain: ["2"]}
  - {id: XLING-AR2EN-01, category: CROSS_LINGUAL, xling: AR_TO_EN, language: ar, target_language: en, asker: E-1001,
     about_department: D-LEG, facts: [LEG_CONTRACT_REVIEW_DAYS], question: "كم يوم عمل تحتاج الإدارة القانونية لمراجعة عقد قياسي؟", must_contain: ["5"],
     note: "fact exists only in English documents"}
  - {id: XLING-AR2EN-02, category: CROSS_LINGUAL, xling: AR_TO_EN, language: ar, target_language: en, asker: E-1001,
     facts: [LOST_BADGE_REPORT_HOURS], question: "فقدت بطاقة الدخول الخاصة بي، خلال كم ساعة يجب أن أبلغ؟", must_contain: ["24"],
     note: "fact exists only in English documents"}
  - {id: XLING-AR2EN-03, category: CROSS_LINGUAL, xling: AR_TO_EN, language: ar, target_language: en, asker: E-1001,
     facts: [REFERRAL_PROBATION], question: "متى يحصل الموظف على مكافأة ترشيح مرشح للوظيفة؟", must_contain: ["probation|الاختبار"],
     note: "fact exists only in English documents"}
  - {id: XLING-AR2EN-04, category: CROSS_LINGUAL, xling: AR_TO_EN, language: ar, target_language: en, asker: E-1001,
     facts: [MEETING_MINUTES_HOURS], question: "خلال كم ساعة يجب إرسال محضر الاجتماع للحضور؟", must_contain: ["24"]}
  - {id: XLING-AR2EN-05, category: CROSS_LINGUAL, xling: AR_TO_EN, language: ar, target_language: en, asker: E-1001,
     facts: [SUSPENSION_MAX_DAYS], question: "ما أقصى مدة للإيقاف عن العمل كعقوبة؟", must_contain: ["5"]}
  - {id: XLING-EG-01, category: CROSS_LINGUAL, xling: EG_TO_MSA, language: ar-eg, target_language: ar-msa, asker: E-1001,
     facts: [LATE_GRACE_MINUTES], question: "لو وصلت متأخر ربع ساعة الصبح هيتحسب عليا تأخير؟", must_contain: ["15"]}
  - {id: XLING-EG-02, category: CROSS_LINGUAL, xling: EG_TO_MSA, language: ar-eg, target_language: ar-msa, asker: E-1001,
     facts: [CASUAL_LEAVE_SAME_DAY_TIME], question: "ينفع آخد يوم عارضة النهارده؟ لازم أطلبه لحد الساعة كام؟", must_contain: ["10:00"]}
  - {id: XLING-EG-03, category: CROSS_LINGUAL, xling: EG_TO_MSA, language: ar-eg, target_language: ar-msa, asker: E-1001,
     facts: [REMOTE_DAYS_PER_WEEK], question: "أقدر أشتغل من البيت كام يوم في الأسبوع؟", must_contain: ["2"]}
  - {id: XLING-EG-04, category: CROSS_LINGUAL, xling: EG_TO_MSA, language: ar-eg, target_language: ar-msa, asker: E-1001,
     facts: [PAYDAY], question: "المرتب بينزل يوم كام في الشهر؟", must_contain: ["25"]}
  - {id: XLING-EG-05, category: CROSS_LINGUAL, xling: EG_TO_MSA, language: ar-eg, target_language: ar-msa, asker: E-1001,
     facts: [SICK_NOTIFY_TIME], question: "لو عيان ومش هقدر آجي، لازم أقول لمديري قبل الساعة كام؟", must_contain: ["10:00"]}
  - {id: XLING-EG-06, category: CROSS_LINGUAL, xling: EG_TO_MSA, language: ar-eg, target_language: ar-msa, asker: E-1001,
     facts: [WARNING_VALIDITY_MONTHS], question: "الإنذار بيفضل في ملفي لمدة قد إيه؟", must_contain: ["12"]}
  - {id: XLING-MIX-01, category: CROSS_LINGUAL, xling: MIXED, language: mixed, asker: E-1001,
     facts: [ANNUAL_LEAVE_LONG_SERVICE_DAYS], question: "كام يوم annual leave بيبقى ليا بعد 10 years service؟", must_contain: ["30"]}
  - {id: XLING-MIX-02, category: CROSS_LINGUAL, xling: MIXED, language: mixed, asker: E-1001,
     facts: [REMOTE_CORE_HOURS], question: "In the سياسة العمل عن بعد, what are the core hours?", must_contain: ["10:00", "15:00"]}
  - {id: XLING-MIX-03, category: CROSS_LINGUAL, xling: MIXED, language: mixed, asker: E-1001,
     facts: [LATE_GRACE_MINUTES], question: "إيه الـ grace period بتاعة الـ check-in الصبح؟", must_contain: ["15"]}
  - {id: XLING-MIX-04, category: CROSS_LINGUAL, xling: MIXED, language: mixed, asker: E-1001,
     facts: [OVERTIME_MAX_HOURS_WEEK], question: "الـ overtime الحد الأقصى بتاعه كام ساعة في الـ week؟", must_contain: ["10"]}

  # ================================================================= UNANSWERABLE (10) - the corpus does not cover these topics
  - {id: UNANS-EN-01, category: UNANSWERABLE, language: en, asker: E-1001, expected_behavior: ABSTAIN,
     question: "How many weeks of maternity leave does the company give?", absent_terms: [maternity, الأمومة]}
  - {id: UNANS-EN-02, category: UNANSWERABLE, language: en, asker: E-1001, expected_behavior: ABSTAIN,
     question: "Do employees receive stock options?", absent_terms: [stock option, خيارات الأسهم]}
  - {id: UNANS-EN-03, category: UNANSWERABLE, language: en, asker: E-1001, expected_behavior: ABSTAIN,
     question: "What percentage of my salary goes to the company pension plan?", absent_terms: [pension, المعاش]}
  - {id: UNANS-EN-04, category: UNANSWERABLE, language: en, asker: E-1001, expected_behavior: ABSTAIN,
