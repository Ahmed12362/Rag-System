# Non-secret defaults only. Secrets and local settings come from the git-ignored .env file
# (imported below) or from real environment variables, which take precedence.
spring:
  application:
    name: hris-rag
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:hris_rag}
    username: ${DB_USER:hris_user}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true   # pgjdbc rewrites JDBC batches into multi-row INSERTs (seeding performance)

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema (decision D2)

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true                 # RFC 9457 error bodies for validation and other MVC errors
  ai:
    retry:
      max-attempts: 1               # our gateways (EmbeddingService, GenerationService) own retry and quota handling
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash-lite      # decision D5
            temperature: 0.0
        embedding:
          api-key: ${GOOGLE_API_KEY}
          text:
            options:
              model: gemini-embedding-001     # decision D5
              dimensions: 768

hrisrag:
  seed:
    run: false                    # reseed only when explicitly requested: --hrisrag.seed.run=true
    profile: STANDARD             # TEST | STANDARD | LARGE
    seed: 42
    reference-date: 2026-11-01    # the dataset's "today"; benchmark anchors assume this date

  rag:
    top-k: 5
    max-context-tokens: 2500
    chat-model: gemini-3.5-flash-lite   # answering model (D5)
    temperature: 0.0
    generation-timeout: 60s
    hybrid:
      candidates: 20                # vector top-20 and keyword top-20 are fused ...
      rrf-k: 60                     # ... with Reciprocal Rank Fusion, 1/(k + rank); then the top-k above
  guardrails:
    input-injection: BLOCK          # BLOCK | FLAG | OFF  (direct prompt injection in the question)
    context-screening: REDACT       # REDACT | FLAG | OFF (instruction-like sentences inside retrieved passages)
    output-check: true              # withhold answers that leak the system prompt or a secret
  security:
    demo-password: ${APP_DEMO_PASSWORD:}   # shared password of the simulated users; .env only, stored as BCrypt
  benchmark:
    run: false                      # run only when requested: --hrisrag.benchmark.run=true
    dataset-file: benchmark/hris-bench-v1.yaml
    corpus-spec-dir: corpus-spec
    cases: ""                       # e.g. SEC-*,FACT-EN-0* (blank = all)
    limit: 10                       # free-tier quota guard; full run: --hrisrag.benchmark.limit=0
    strategy: NAIVE                 # NAIVE | HYBRID
    pause: 4s                       # after each chat call (rate limiting)
    # compare-with: 1               # optional: experiment id printed side by side in the report
    report-dir: reports/benchmark
  embedding:
    model: gemini-embedding-001     # same model for documents and queries (D5); changing it requires a full re-embed
    dimensions: 768
    batch-size: 25
  ingest:
    run: false                      # ingest only when requested: --hrisrag.ingest.run=true
    corpus-dir: corpus
    chunking:
      target-tokens: 250
      max-tokens: 400
      min-tokens: 40
      overlap-tokens: 40

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized   # public probe shows only UP/DOWN; details for an authenticated HR_ADMIN
      roles: HR_ADMIN
