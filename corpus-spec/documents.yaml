# Document plan (Task 3.2): one entry per corpus document, expanded by CorpusSpec.
#
# Entry fields
#   key      base key; the language is appended: POL-ANNUAL-LEAVE + en -> POL-ANNUAL-LEAVE-EN
#   langs    [en], [ar] or [en, ar] (one document per language)
#   title    string, or {en: ..., ar: ...}
#   group    CORE | SUPERSEDED | PROCEDURE | FAQ | HANDBOOK | DEPARTMENT | CONFIDENTIAL | DRAFT | DISTRACTOR | INJECTION
#   type     POLICY | PROCEDURE | FAQ | HANDBOOK | DEPARTMENT_POLICY   (selects default sections and length)
#   cat      category
#   facts    fact ids from facts.yaml; every listed fact must be stated, and no other numbers may appear
#   optional version, status, effective, expiry, scope, access, intent, dialect (egyptian), injection, topic, sections, words
#
# `metadata` fields become YAML front matter in the corpus file. Generation-only fields (group, facts, intent, dialect,
# injection, topic, sections, words) are never written to the corpus and never ingested.

defaults: {version: "1.0", status: ACTIVE, effective: 2026-01-01, expiry: null, scope: null, access: INTERNAL}

section_templates:
  POLICY:            {en: [Purpose, Scope, Policy, Responsibilities, Exceptions, Related documents],
                      ar: [الغرض, النطاق, السياسة, المسؤوليات, الاستثناءات, وثائق ذات صلة]}
  PROCEDURE:         {en: [Purpose, Who this applies to, Steps, Timelines, Contacts],
                      ar: [الغرض, الفئة المستهدفة, الخطوات, المدد الزمنية, جهات الاتصال]}
  HANDBOOK:          {en: [Overview, Details, What employees should do, Related policies],
                      ar: [نظرة عامة, التفاصيل, ما يجب على الموظف فعله, سياسات ذات صلة]}
  DEPARTMENT_POLICY: {en: [Purpose, Applies to, Department rule, Rationale, Escalation],
                      ar: [الغرض, نطاق التطبيق, قاعدة الإدارة, المبررات, التصعيد]}
  FAQ:               {questions: 6}

words: {POLICY: [450, 750], PROCEDURE: [350, 600], HANDBOOK: [350, 600], DEPARTMENT_POLICY: [250, 450], FAQ: [350, 650]}

